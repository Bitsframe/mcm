name: Cypress Tests with Cloud Recording + ClickUp

on:
  push:
    branches:
      - qa

jobs:
  cypress-run:
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
      CYPRESS_PROJECT_ID: ${{ secrets.CYPRESS_PROJECT_ID }}
      CYPRESS_BASE_URL: http://localhost:3000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Create results directory
        run: mkdir -p cypress/results

      # Start the dev server and pre-compile every route used by any spec.
      # Next.js dev compiles routes on first request; doing this before Cypress
      # starts prevents ESOCKETTIMEDOUT mid-test when a route is hit cold.
      - name: Start dev server and warm up all routes
        run: |
          yarn dev &
          echo "Waiting for server to be ready..."
          npx wait-on http://localhost:3000 --timeout 120000
          echo "Server ready. Pre-compiling all routes..."
          curl -s --max-time 60 http://localhost:3000/en/login > /dev/null
          curl -s --max-time 60 http://localhost:3000/en/inventory/manage > /dev/null
          curl -s --max-time 60 http://localhost:3000/en/pos/sales/patients > /dev/null
          curl -s --max-time 60 http://localhost:3000/en/pos/history > /dev/null
          curl -s --max-time 60 http://localhost:3000/en/pos/return > /dev/null
          curl -s --max-time 60 http://localhost:3000/en/transactions > /dev/null
          curl -s --max-time 60 http://localhost:3000/en/warehouse/manage > /dev/null
          curl -s --max-time 60 http://localhost:3000/en/warehouse/manage/products > /dev/null
          curl -s --max-time 60 http://localhost:3000/en/bonus/location > /dev/null
          echo "All routes pre-compiled."

      # Run inventory spec only
      - name: Cypress Cloud Run
        id: cypress
        uses: cypress-io/github-action@v6
        with:
          # Server is already running from the warm-up step — just point at it
          wait-on: "http://localhost:3000"
          wait-on-timeout: 30
          spec: cypress/e2e/bonus_individual.cy.ts
          record: true

      - name: Get Cypress Run ID
        if: always()
        id: get-run-id
        run: |
          RUN_ID="${{ steps.cypress.outputs.runId }}"
          echo "runId=${RUN_ID}" >> $GITHUB_OUTPUT
          echo "🎯 Cypress Run ID: ${RUN_ID}"

      - name: Merge mochawesome reports
        if: always()
        run: |
          echo "📁 Results directory contents:"
          ls -la cypress/results/ || echo "No results directory"
          if ls cypress/results/mochawesome*.json 1> /dev/null 2>&1; then
            echo "🔗 Merging mochawesome reports..."
            npx mochawesome-merge cypress/results/mochawesome*.json > cypress/results/merged-report.json
            echo "✅ Merged report created"
          else
            echo "⚠️ No mochawesome JSON files found to merge"
          fi
